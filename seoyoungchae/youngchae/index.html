<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Youngchae's Personal Workspace & Portfolio Page">
    <title>Youngchae | Web Workspace</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Background glow blobs */
        .glow-blob {
            position: absolute;
            width: 350px;
            height: 350px;
            background: var(--accent-gradient);
            filter: blur(120px);
            opacity: 0.25;
            border-radius: 50%;
            z-index: 0;
            animation: pulse 8s ease-in-out infinite alternate;
        }

        .glow-blob.top-left {
            top: -100px;
            left: -100px;
        }

        .glow-blob.bottom-right {
            bottom: -100px;
            right: -100px;
            animation-delay: -4s;
        }

        @keyframes pulse {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.2) translate(30px, 30px); }
        }

        .container {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 800px;
            padding: 2.5rem;
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .gradient-text {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
        }

        p.subtitle {
            font-size: 1.15rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .badge-container {
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-bottom: 2.5rem;
        }

        .badge {
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            font-size: 0.875rem;
            color: var(--text-main);
            transition: all 0.3s ease;
        }

        .badge:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .cta-button {
            display: inline-block;
            padding: 0.9rem 2rem;
            background: var(--accent-gradient);
            color: #ffffff;
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
        }

        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(99, 102, 241, 0.6);
        }

        footer {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="glow-blob top-left"></div>
    <div class="glow-blob bottom-right"></div>

    <main class="container">
        <h1>Welcome to <span class="gradient-text">Youngchae's World</span></h1>
        <p class="subtitle">
            로컬 환경에 성공적으로 생성된 HTML 메인 페이지입니다.<br>
            세련되고 현대적인 웹 애플리케이션 스타일에 맞춰 커스터마이징해 보세요.
        </p>

        <div class="badge-container">
            <span class="badge">🚀 HTML5 & CSS3</span>
            <span class="badge">✨ Dark Mode UI</span>
            <span class="badge">⚡ Dynamic Gradient</span>
            <span class="badge">📱 Responsive</span>
        </div>

        <button class="cta-button" onclick="alert('Youngchae의 Workspace 페이지에 오신 것을 환영합니다!')">
            시작하기
        </button>
    </main>

    <footer>
        &copy; 2026 Youngchae Workspace. All rights reserved.
    </footer>

</body>
</html>
