<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sunny · voice agent</title>
<style>
  :root {
    --bg: #0e0f13;
    --panel: #16181f;
    --line: #262a35;
    --text: #e6e8ef;
    --dim: #7b8296;
    --accent: #8ab4ff;
    --ok: #67d98b;
    --warn: #e8c56a;
    --err: #ef7d7d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 20px;
    background: var(--bg); color: var(--text);
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    display: flex; justify-content: center;
  }
  .wrap { width: 100%; max-width: 620px; }

  h1 { font-size: 19px; margin: 0 0 4px; letter-spacing: -0.2px; }
  .sub { color: var(--dim); font-size: 13px; margin: 0 0 24px; }

  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 18px; margin-bottom: 14px;
  }

  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .row + .row { margin-top: 14px; }

  button {
    font: inherit; font-weight: 500; color: var(--text);
    background: #232734; border: 1px solid var(--line);
    padding: 8px 16px; border-radius: 8px; cursor: pointer;
  }
  button:hover:not(:disabled) { background: #2b3040; }
  button:disabled { opacity: 0.35; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #0e0f13; }
  button.primary:hover:not(:disabled) { background: #9dc0ff; }

  select, input[type=range] { font: inherit; accent-color: var(--accent); }
  select {
    color: var(--text); background: #232734;
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px;
  }
  label { color: var(--dim); font-size: 13px; }

  .dot { width: 9px; height: 9px; border-radius: 50%; background: #444b5e; display: inline-block; }
  .dot.connecting { background: var(--warn); }
  .dot.live { background: var(--ok); box-shadow: 0 0 0 4px rgba(103,217,139,0.15); }
  .dot.error { background: var(--err); }
  #statusText { color: var(--dim); font-size: 13px; }

  .meter { position: relative; height: 8px; background: #0b0c10;
           border-radius: 4px; overflow: hidden; flex: 1; }
  .meter .fill { height: 100%; width: 0%; border-radius: 4px; transition: width 60ms linear; }
  #micFill { background: var(--accent); }
  #speakFill { background: var(--ok); }
  #thrLine { position: absolute; top: -2px; bottom: -2px; width: 2px;
             background: var(--warn); left: 0; }
  .meter-label { width: 62px; color: var(--dim); font-size: 12px; }

  .bubble { margin-top: 12px; }
  .bubble .who { color: var(--dim); font-size: 12px; margin-bottom: 3px; }
  .bubble .what { min-height: 22px; }
  #agentText { color: var(--accent); }

  #log {
    height: 150px; overflow-y: auto; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11.5px; line-height: 1.7; color: var(--dim);
  }
  #log .o { color: var(--ok); }
  #log .w { color: var(--warn); }
  #log .e { color: var(--err); }

  .hint { color: var(--dim); font-size: 12px; margin-top: 10px; }
  code { background: #0b0c10; padding: 1px 5px; border-radius: 4px; font-size: 11.5px; }
</style>
</head>
<body>
<div class="wrap">

  <h1>sunny · voice agent</h1>
  <p class="sub">Gemini Live API · 마이크로 말하면 음성으로 답합니다. 말을 끊으면 즉시 멈춥니다.</p>

  <div class="panel">
    <div class="row">
      <button id="connectBtn" class="primary">Connect</button>
      <button id="disconnectBtn" disabled>Disconnect</button>
      <span class="dot" id="dot"></span><span id="statusText">disconnected</span>
    </div>

    <div class="row">
      <label for="voice">목소리</label>
      <select id="voice">
        <option>Charon</option>
        <option>Puck</option>
        <option>Kore</option>
        <option>Aoede</option>
        <option>Fenrir</option>
        <option>Zephyr</option>
      </select>
      <button id="previewBtn">이 목소리 듣기</button>
    </div>

    <div class="row">
      <span class="meter-label">마이크</span>
      <div class="meter"><div class="fill" id="micFill"></div><div id="thrLine"></div></div>
    </div>
    <div class="row">
      <span class="meter-label">스피커</span>
      <div class="meter"><div class="fill" id="speakFill"></div></div>
    </div>
    <div class="row">
      <label for="thrRange">끼어들기 감도</label>
      <input type="range" id="thrRange" min="0.02" max="0.40" step="0.01" style="flex:1">
      <span id="thrVal" style="color:var(--warn);font-size:12px;width:32px">0.12</span>
    </div>
    <p class="hint">노란 선보다 마이크 막대가 커지면 끼어든 것으로 봅니다. 잘 안 끊기면 왼쪽으로, 혼자 끊기면 오른쪽으로.</p>
  </div>

  <div class="panel">
    <div class="bubble"><div class="who">나</div><div class="what" id="youText"></div></div>
    <div class="bubble"><div class="who">에이전트</div><div class="what" id="agentText"></div></div>
  </div>

  <div class="panel">
    <div id="log"></div>
    <p class="hint">키는 <code>key.js</code> 에만 넣습니다. 이 파일은 <code>.gitignore</code> 에 있어 커밋되지 않습니다.</p>
  </div>

</div>

<script src="key.js"></script>
<script src="app.js"></script>
</body>
</html>
