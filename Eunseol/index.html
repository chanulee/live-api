<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>삐 · 이의 있음</title>
<style>
  :root {
    --bg:#fff4e2;
    --ink:#3d2a1c;
    --dim:#8a6d55;
    --card:#fffaf1;
    --line:#f0d9b8;
    --lemon:#ffd84a;
    --peach:#ff9a7a;
    --blush:#ff7d93;
    --mint:#7ee0b0;
    --sky:#7ec8ff;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh;
    background:
      radial-gradient(1200px 600px at 50% -10%, #ffe9b8 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    font:15px/1.5 "Apple SD Gothic Neo", -apple-system, sans-serif;
    display:flex; justify-content:center;
  }
  main {
    width:100%; max-width:480px;
    padding:28px 20px 40px;
    display:flex; flex-direction:column; align-items:center;
  }
  .title { text-align:center; margin-bottom:4px; }
  h1 { font-size:22px; margin:0; letter-spacing:-0.04em; }
  .sub { margin:6px 0 0; color:var(--dim); font-size:13px; }

  .stage {
    position:relative;
    width:280px; height:300px;
    margin:8px 0 6px;
    display:flex; align-items:center; justify-content:center;
  }
  .buddy {
    width:240px; height:240px;
    cursor:pointer;
    transform-origin:50% 70%;
    transition:transform .25s ease;
  }
  .buddy:hover { transform:scale(1.03) rotate(-2deg); }
  .buddy svg { width:100%; height:100%; overflow:visible; }
  .blob { filter: drop-shadow(0 18px 0 rgba(80,40,10,.08)); }

  .blush { fill: var(--blush); opacity:.45; }
  .brow { fill:none; stroke:#3d2a1c; stroke-width:7; stroke-linecap:round; }
  .eye { fill:#2b1b12; }
  .shine { fill:#fff; }
  .mouth { fill:#2b1b12; }
  .tongue { fill:var(--peach); }
  .tooth { fill:#fff; }

  .look { display:none; }
  .mood-tease .look-tease,
  .mood-idle .look-tease,
  .mood-listen .look-listen,
  .mood-talk .look-talk,
  .mood-error .look-error { display:block; }

  .buddy.mood-tease { animation: float 2.8s ease-in-out infinite; }
  .buddy.mood-listen { animation: lean 1.2s ease-in-out infinite; }
  .buddy.mood-talk { animation: bounce 0.28s ease-in-out infinite; }
  .buddy.mood-talk .look-talk .jaw { transform-origin:120px 140px; animation: jabber .22s ease-in-out infinite; }
  .buddy.mood-error { animation: shake .45s ease-in-out infinite; }

  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  @keyframes lean { 0%,100%{transform:rotate(-3deg)} 50%{transform:rotate(4deg) scale(1.02)} }
  @keyframes bounce { 0%,100%{transform:scale(1,1)} 50%{transform:scale(1.04,.96) translateY(-4px)} }
  @keyframes jabber { 0%,100%{transform:scaleY(1)} 50%{transform:scaleY(1.35)} }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }

  .name-tag {
    display:flex; flex-direction:column; align-items:center; gap:4px;
    margin-bottom:18px;
  }
  .chip {
    background:var(--lemon); color:var(--ink);
    font-weight:800; font-size:13px;
    padding:4px 12px; border-radius:999px;
    box-shadow: 0 3px 0 #e6b82a;
  }

  .controls { display:flex; gap:10px; align-items:center; margin-bottom:18px; }
  button {
    font:inherit; font-weight:800; cursor:pointer;
    border:0; border-radius:999px; padding:12px 22px;
  }
  #connectBtn {
    background:var(--ink); color:#fff;
    box-shadow: 0 4px 0 #2a1c12;
  }
  #connectBtn:hover { transform:translateY(-1px); }
  #disconnectBtn {
    background:transparent; color:var(--dim);
    border:2px solid var(--line);
  }
  button:disabled { opacity:.35; cursor:not-allowed; transform:none; }

  .status { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--dim); }
  .dot { width:8px; height:8px; border-radius:50%; background:#c9b49a; }
  .dot.connecting { background:#ffb020; }
  .dot.live { background:var(--mint); box-shadow:0 0 0 4px rgba(126,224,176,.25); }
  .dot.error { background:#ff5a5a; }

  .meters { width:100%; display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
  .meter { display:flex; align-items:center; gap:10px; font-size:12px; color:var(--dim); }
  .meter .lab { width:36px; font-weight:700; }
  .meter .bar {
    flex:1; height:8px; border-radius:99px;
    background:#f3e2c7; overflow:hidden; position:relative;
  }
  .meter .fill { height:100%; width:0%; border-radius:99px; }
  #micFill { background:var(--sky); }
  #speakFill { background:var(--peach); }
  #thrLine { position:absolute; top:0; bottom:0; width:2px; background:#e6b82a; }

  .transcripts { width:100%; display:flex; flex-direction:column; gap:10px; margin-bottom:14px; }
  .bubble {
    background:var(--card); border:2px solid var(--line);
    border-radius:22px; padding:12px 14px; min-height:64px;
  }
  .bubble.you { border-bottom-left-radius:8px; }
  .bubble.me { border-bottom-right-radius:8px; background:#fff6d6; border-color:#f0d36a; }
  .bubble h2 { margin:0 0 4px; font-size:11px; letter-spacing:.08em; color:var(--dim); }
  .bubble p { margin:0; font-size:14px; white-space:pre-wrap; word-break:break-word; }

  .composer {
    width:100%; display:flex; gap:8px; margin:0 0 14px;
  }
  .composer input {
    flex:1; min-width:0;
    padding:12px 14px; border-radius:999px;
    border:2px solid var(--line); background:var(--card);
    font:inherit; color:var(--ink); outline:none;
  }
  .composer input:focus { border-color:#f0d36a; }
  .composer input::placeholder { color:#c4a88a; }
  #sendBtn {
    padding:12px 18px; background:var(--lemon); color:var(--ink);
    box-shadow: 0 3px 0 #e6b82a; flex-shrink:0;
  }

  details {
    width:100%; background:var(--card); border:2px solid var(--line);
    border-radius:16px; padding:8px 12px;
  }
  summary { cursor:pointer; color:var(--dim); font-size:12px; font-weight:700; }
  #log {
    margin-top:8px; height:140px; overflow-y:auto;
    font:11px/1.5 ui-monospace, Menlo, monospace;
    color:var(--dim); white-space:pre-wrap; word-break:break-all;
  }
  #log .e { color:#d13b3b; }
  #log .o { color:#2a9a64; }
  #log .w { color:#c47a00; }
  .note { color:var(--dim); font-size:11px; margin-top:12px; text-align:center; }
  code { color:var(--ink); }
</style>
</head>
<body>
<main>
  <div class="title">
    <h1>이의 있음</h1>
    <p class="sub">비판하고, 비웃고, 장난치는 초등 에이전트</p>
  </div>

  <div class="stage">
    <div id="buddy" class="buddy mood-tease" title="날 누르면 대화 시작">
      <svg class="blob" viewBox="0 0 240 240" aria-hidden="true">
        <defs>
          <radialGradient id="skin" cx="38%" cy="30%">
            <stop offset="0%" stop-color="#fff6b0"/>
            <stop offset="62%" stop-color="#ffd24a"/>
            <stop offset="100%" stop-color="#f0b02a"/>
          </radialGradient>
        </defs>
        <ellipse cx="120" cy="226" rx="62" ry="10" fill="rgba(80,40,10,.12)"/>
        <circle cx="120" cy="118" r="94" fill="url(#skin)"/>
        <ellipse class="blush" cx="64" cy="124" rx="20" ry="11"/>
        <ellipse class="blush" cx="176" cy="124" rx="20" ry="11"/>

        <!-- 약올리고 장난치는 기본 얼굴: 중안부 짧게, 눈-입 간격 타이트 -->
        <g class="look look-tease">
          <path class="brow" d="M60 86 Q86 72 110 88"/>
          <path class="brow" d="M132 78 Q158 64 184 86"/>
          <ellipse class="eye" cx="86" cy="112" rx="13" ry="16"/>
          <ellipse class="eye" cx="154" cy="114" rx="15" ry="8"/>
          <circle class="shine" cx="81" cy="106" r="4"/>
          <path class="mouth" d="M94 136 Q126 154 164 132 Q148 150 122 148 Q100 144 94 136Z"/>
          <ellipse class="tongue" cx="126" cy="148" rx="11" ry="8"/>
        </g>

        <g class="look look-listen">
          <path class="brow" d="M62 88 Q86 78 110 88"/>
          <path class="brow" d="M134 88 Q158 78 182 88"/>
          <ellipse class="eye" cx="86" cy="114" rx="14" ry="16"/>
          <ellipse class="eye" cx="154" cy="114" rx="14" ry="16"/>
          <circle class="shine" cx="81" cy="107" r="4"/>
          <circle class="shine" cx="149" cy="107" r="4"/>
          <path class="mouth" d="M110 140 Q122 132 138 140 Q124 150 110 140Z"/>
        </g>

        <g class="look look-talk">
          <path class="brow" d="M60 84 Q86 70 110 86"/>
          <path class="brow" d="M134 80 Q158 66 184 86"/>
          <ellipse class="eye" cx="86" cy="112" rx="13" ry="15"/>
          <ellipse class="eye" cx="154" cy="112" rx="13" ry="9"/>
          <circle class="shine" cx="81" cy="106" r="3.5"/>
          <g class="jaw">
            <ellipse class="mouth" cx="122" cy="140" rx="20" ry="14"/>
            <ellipse class="tongue" cx="122" cy="147" rx="10" ry="7"/>
            <rect class="tooth" x="113" y="130" width="8" height="6" rx="1"/>
            <rect class="tooth" x="123" y="130" width="8" height="6" rx="1"/>
          </g>
        </g>

        <g class="look look-error">
          <path class="brow" d="M64 96 Q86 102 110 94"/>
          <path class="brow" d="M134 94 Q158 102 180 96"/>
          <ellipse class="eye" cx="86" cy="116" rx="12" ry="5"/>
          <ellipse class="eye" cx="154" cy="116" rx="12" ry="5"/>
          <path class="mouth" d="M108 142 Q124 132 140 142"/>
        </g>
      </svg>
    </div>
  </div>

  <div class="name-tag">
    <span class="chip">삐</span>
  </div>

  <div class="controls">
    <button id="connectBtn">놀러 오기</button>
    <button id="disconnectBtn" disabled>그만하기</button>
    <div class="status"><span id="dot" class="dot"></span><span id="statusText">disconnected</span></div>
  </div>

  <div class="meters">
    <div class="meter">
      <span class="lab">너</span>
      <div class="bar"><div id="micFill" class="fill"></div><div id="thrLine"></div></div>
    </div>
    <div class="meter">
      <span class="lab">삐</span>
      <div class="bar"><div id="speakFill" class="fill"></div></div>
    </div>
  </div>

  <div class="transcripts">
    <div class="bubble you"><h2>너</h2><p id="youText">&mdash;</p></div>
    <div class="bubble me"><h2>삐</h2><p id="geminiText">&mdash;</p></div>
  </div>
  <form class="composer" id="textForm">
    <input id="textInput" type="text" autocomplete="off" placeholder="마이크가 안 되면 여기 쳐서 말해">
    <button id="sendBtn" type="submit">보내기</button>
  </form>

  <details>
    <summary>로그</summary>
    <div id="log"></div>
  </details>
  <p class="note">
    <code>python3 -m http.server</code> 로 연 <code>http://localhost:8000/Eunseol/</code>
  </p>
</main>
<script src="key.js"></script>
<script src="app.js"></script>
</body>
</html>
